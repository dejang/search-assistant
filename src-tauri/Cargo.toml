[package]
name = "research-buddy"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "research_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
obscura = { git = "https://github.com/h4ckf0r0day/obscura", features = ["api"] }
htmd = "0.5"
regex = "1"
# `rig-core`'s default `derive` feature pulls the `rig-derive` proc-macro for
# derives this crate does not use; `rustls` and `reqwest` are what the OpenAI
# client actually needs (`reqwest` is not a default feature and is required for
# `OpenAI::from_env` / `OpenAIConfig::client`).
rig-core = { version = "0.45", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "0.45", default-features = false }
# `hf-hub` speaks the Hub API (resolve, LFS, xet) so the GGUF download needs no
# hand-rolled redirect handling; `blocking` stays off because every call site here
# already runs on Tauri's tokio runtime.
hf-hub = "1"
# The version `hf-hub` speaks, so its builder will take the client back: it is
# how the download gets the timeouts `hf-hub` leaves unset. Features stay off
# because Cargo unions them with `hf-hub`'s own request.
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
# `time` and `macros` are used by library code (`agent::BuddyAgent::ask_within`);
# the runtime and IO features are needed solely by the tests below.
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
# The downloader tests build model folders they can throw away.
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
self_named_module_files = "deny"

[lints.rust]
unreachable_pub = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

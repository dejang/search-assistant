[package]
name = "research-buddy"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "research_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
# `log::info!` writes nowhere without a logger; this one prints to stdout under
# `tauri dev` and to the app log directory in a built app.
tauri-plugin-log = "2"
log = "0.4"
# Query values are form-encoded into the search URL, and DuckDuckGo's redirect
# links are form-decoded back out of it.
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the tag the browser is known to run on. The default branch panics in
# `deno_core` (`op_initial_frame ... re-entrantly invoked op op_dom`) on any page
# that runs scripts, which aborts the app.
obscura = { git = "https://github.com/h4ckf0r0day/obscura", tag = "v0.2.3", features = ["api"] }
htmd = "0.5"
regex = "1"
# `rig-core`'s default `derive` feature pulls the `rig-derive` proc-macro for
# derives this crate does not use; `rustls` and `reqwest` are what the OpenAI
# client actually needs (`reqwest` is not a default feature and is required for
# `OpenAI::from_env` / `OpenAIConfig::client`).
rig-core = { version = "0.45", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "0.45", default-features = false }
# `hf-hub` speaks the Hub API (resolve, LFS, xet) so the GGUF download needs no
# hand-rolled redirect handling; `blocking` stays off because every call site here
# already runs on Tauri's tokio runtime.
hf-hub = "1"
# The version `hf-hub` speaks, so its builder will take the client back: it is
# how the download gets the timeouts `hf-hub` leaves unset. Features stay off
# because Cargo unions them with `hf-hub`'s own request.
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
# `time` and `macros` are used by library code (`agent::BuddyAgent::ask_within`)
# and by the tests below. `rt` and `net` let `url_extractor` drive obscura on a
# current-thread runtime, the only flavor one isolate tolerates, and `sync` gives
# it the permits that bound how many run at once.
tokio = { version = "1", features = ["time", "macros", "rt", "net", "sync"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[dev-dependencies]
axum = "0.8"
futures-core = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
# The downloader tests build model folders they can throw away.
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
self_named_module_files = "deny"

[lints.rust]
unreachable_pub = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

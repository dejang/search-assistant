<!DOCTYPE html>
<html>
<head><title>Rich Content</title></head>
<body>
  <h1>Article Title</h1>
  <h2>Section One</h2>
  <p>First paragraph of the article.</p>
  <blockquote>
    <p>A wise quote from someone.</p>
  </blockquote>
  <h2>Code Example</h2>
  <pre><code class="language-rust">fn main() {
    println!("hello");
}</code></pre>
  <p>Inline <code>let x = 42;</code> in a sentence.</p>
  <h2>Ordered List</h2>
  <ol>
    <li>First item</li>
    <li>Second item</li>
    <li>Third item</li>
  </ol>
  <h2>Table</h2>
  <table>
    <thead><tr><th>Name</th><th>Value</th></tr></thead>
    <tbody><tr><td>Alpha</td><td>1</td></tr></tbody>
  </table>
  <script>var tracking = "should not appear";</script>
  <style>.hidden { display: none; }</style>
</body>
</html>

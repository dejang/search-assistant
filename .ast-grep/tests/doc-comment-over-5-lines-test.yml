id: doc-comment-over-5-lines
valid:
  - |
    /// Five doc lines state a contract and stop.
    ///
    /// The middle paragraph is two lines long and the
    /// blank separators count toward the limit here.
    ///
    fn probe() {}
  - |
    //! Module documentation inside the limit.
    //!
    //! It gets the same five lines any other doc
    //! comment gets, no more.
    fn probe() {}
  - |
    /// Example code does not eat the budget, so a
    /// doctest may run as long as it needs to.
    ///
    /// ```no_run
    /// use probe::Thing;
    ///
    /// # async fn run() -> Result<(), Box<dyn std::error::Error>> {
    /// let thing = Thing::new()?;
    /// thing.run().await?;
    /// # Ok(())
    /// # }
    /// ```
    fn probe() {}
  - |
    /// A rustdoc section heading is exempt and splits
    /// the run, so five lines sit on each side of it.
    ///
    /// # Errors
    ///
    /// Returns an error when the probe finds nothing,
    /// which is the third line of the second section.
    fn probe() {}
  - |
    fn probe() {
        /// Doc comments inside a body document no API,
        /// so comment-over-3-lines owns them and this
        /// rule reports nothing even across six lines.
        ///
        ///
        let _ = 1;
    }
invalid:
  - |
    /// Six doc lines document more than the API does.
    ///
    /// The second paragraph runs on and on about why the
    /// code exists and which alternatives were weighed,
    /// which is narration the outline should carry, and
    /// this sixth line closes the run over the limit.
    fn probe() {}
  - |
    //! Six module doc lines narrate the module's history,
    //!
    //! which is not a contract anyone calling into the
    //! module needs in order to use it correctly, and a
    //! reader can read the git log instead of this block
    //! here, where the sixth line makes it too long.
    fn probe() {}
  - |
    /// Prose that merely opens with a word a code block
    /// would use still counts toward the limit, so the
    /// loop in the folder cannot overflow the stack and
    /// the run keeps going past the fifth line right
    /// here, which is the sixth line of this doc comment
    /// and therefore an error.
    fn probe() {}
  - |
    impl Thing {
        /// A method doc is capped the same way a free
        /// function's is, at any indentation, and this
        /// run carries one line more than the limit, so
        /// the fifth line is not the last one here and
        /// the sixth line closes the run and reports it
        /// on every line of the block.
        fn probe(&self) {}
    }

id: block-comment-over-3-lines
valid:
  - |
    fn probe() {
        /* a block comment of three
           physical lines is within
           the limit */
        let _ = 1;
    }
  - |
    /** Block documentation states an API contract, so it is exempt from the
        limit and may run on for as long as the contract needs to stay accurate
        about the guarantees it gives its callers. */
    fn probe() {}
invalid:
  - |
    fn probe() {
        /* four physical lines of block comment explaining the
           algorithm in detail, which is more than an
           implementation comment may use, so the gate reports
           the whole run */
        let _ = 1;
    }

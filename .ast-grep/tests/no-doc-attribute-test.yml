id: no-doc-attribute
valid:
  - |
    /// Documented the plain way.
    #[doc(hidden)]
    #[doc(alias = "probe")]
    fn probe() {}
  - |
    fn probe() {
        let doc = 1;
        println!("{doc}", doc = doc);
    }
invalid:
  - |
    #[doc = "Hidden from the comment rules."]
    fn probe() {}
  - |
    #![doc = include_str!("../README.md")]
  - |
    #[cfg_attr(docsrs, doc = "Hidden from the comment rules.")]
    fn probe() {}
  - |
    macro_rules! probe {
        () => {
            #[doc = "Hidden from the comment rules."]
            fn probe() {}
        };
    }

id: no-doc-attribute
language: rust
severity: error
message: "Write docs as `///` or `//!` comments, not `doc = ...` attributes, so the comment rules see them."
# Also covers `cfg_attr(..., doc = ...)` and attributes inside macro bodies, where only
# the innermost token tree holding the attribute is reported.
utils:
  macro-doc:
    kind: token_tree
    regex: '#!?\s*\[[^\]]*\bdoc\s*='
rule:
  any:
    - kind: attribute_item
      regex: '\bdoc\s*='
    - kind: inner_attribute_item
      regex: '\bdoc\s*='
    - matches: macro-doc
      not: {has: {matches: macro-doc, stopBy: end}}

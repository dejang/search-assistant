id: comment-max-two-lines-ts
language: TypeScript
severity: error
ignores:
  - agents/**
message: "Avoid narrative comments about implementation details, assumed callers, or reasons for the chosen implementation. Limit an implementation comment to at most two lines. Document API parameters, return values, and error cases as concise statements of the API's own guarantees."
rule:
  # Matches the first comment of a run of adjacent comments whose lines add
  # up to three or more. Blank lines are not nodes, so they do not split a run.
  kind: comment
  not:
    follows: { kind: comment, stopBy: neighbor }
  any:
    - regex: '\n[^\n]*\n'
    - all:
        - regex: '\n'
        - precedes: { kind: comment, stopBy: neighbor }
    - precedes:
        kind: comment
        stopBy: neighbor
        any:
          - regex: '\n'
          - precedes: { kind: comment, stopBy: neighbor }

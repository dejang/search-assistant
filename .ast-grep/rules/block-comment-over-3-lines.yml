id: block-comment-over-3-lines
language: rust
severity: error
message: "Block comment spans four or more lines; redesign instead of explaining (apply-style: Comments and API documentation)."
# A block comment is one comment, so every physical line inside it counts toward the
# three-line limit and a blank line inside it is content, not a run separator. `/**` and
# `/*!` are block doc comments and stay exempt, like `///` and `//!`.
rule:
  kind: block_comment
  regex: '(?s)^/\*[^*!][\s\S]*(\n[\s\S]*){3}'

id: comment-over-3-lines
language: rust
severity: error
message: "Implementation comment is longer than three lines; redesign instead of explaining (apply-style: Comments and API documentation)."
# Every comment line inside a run of four or more plain comments is reported, so an edit
# anywhere in an over-long run lands on a changed line. Doc comments (`///`, `//!`) are
# not matched here: they state API contracts and carry their own, longer limit in
# doc-comment-over-5-lines, except inside a function body, where they cannot document an
# API and so count toward this run and cannot be used to break a run in half.
#
# Known limitation, do not re-derive it: `follows`/`precedes` walk sibling nodes and a
# blank line is trivia, not a node, so `// a // b`, blank, `// c // d` reads as one run
# of four. No rule predicate can see the blank line, so this is not fixable in YAML.
utils:
  plain:
    kind: line_comment
    regex: '^//[^/!]'
  anyline:
    kind: line_comment
  before-1:
    matches: plain
    follows: {matches: plain}
  before-2:
    matches: plain
    follows: {matches: plain, follows: {matches: plain}}
  before-3:
    matches: plain
    follows: {matches: plain, follows: {matches: plain, follows: {matches: plain}}}
  after-1:
    matches: plain
    precedes: {matches: plain}
  after-2:
    matches: plain
    precedes: {matches: plain, precedes: {matches: plain}}
  after-3:
    matches: plain
    precedes: {matches: plain, precedes: {matches: plain, precedes: {matches: plain}}}
  body-before-1:
    matches: anyline
    follows: {matches: anyline}
  body-before-2:
    matches: anyline
    follows: {matches: anyline, follows: {matches: anyline}}
  body-before-3:
    matches: anyline
    follows: {matches: anyline, follows: {matches: anyline, follows: {matches: anyline}}}
  body-after-1:
    matches: anyline
    precedes: {matches: anyline}
  body-after-2:
    matches: anyline
    precedes: {matches: anyline, precedes: {matches: anyline}}
  body-after-3:
    matches: anyline
    precedes: {matches: anyline, precedes: {matches: anyline, precedes: {matches: anyline}}}
rule:
  kind: line_comment
  any:
    - all:
        - matches: plain
        - any:
            - matches: before-3
            - all: [{matches: before-2}, {matches: after-1}]
            - all: [{matches: before-1}, {matches: after-2}]
            - matches: after-3
    - all:
        - inside: {kind: function_item, stopBy: end}
        - any:
            - matches: body-before-3
            - all: [{matches: body-before-2}, {matches: body-after-1}]
            - all: [{matches: body-before-1}, {matches: body-after-2}]
            - matches: body-after-3

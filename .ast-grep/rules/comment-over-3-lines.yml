id: comment-over-3-lines
language: rust
severity: error
message: "Comment run is longer than three lines; redesign instead of explaining (apply-style: Comments and API documentation)."
# Every comment kind counts, and a run spans blank lines and attributes. Every line of
# a block comment counts. `lines-N` ignores the newline a doc comment's text ends with.
utils:
  comment:
    any: [{kind: line_comment}, {kind: block_comment}]
  barrier:
    not: {any: [{kind: attribute_item}, {kind: inner_attribute_item}]}
  lines-2: {regex: '\n[\s\S]'}
  lines-3: {regex: '\n[\s\S]*\n[\s\S]'}
  lines-4: {regex: '\n[\s\S]*\n[\s\S]*\n[\s\S]'}
  fwd-1: {matches: comment}
  fwd-2:
    matches: comment
    any:
      - matches: lines-2
      - precedes: {matches: fwd-1, stopBy: {matches: barrier}}
  fwd-3:
    matches: comment
    any:
      - matches: lines-3
      - all:
          - matches: lines-2
          - precedes: {matches: fwd-1, stopBy: {matches: barrier}}
      - precedes: {matches: fwd-2, stopBy: {matches: barrier}}
  fwd-4:
    matches: comment
    any:
      - matches: lines-4
      - all:
          - matches: lines-3
          - precedes: {matches: fwd-1, stopBy: {matches: barrier}}
      - all:
          - matches: lines-2
          - precedes: {matches: fwd-2, stopBy: {matches: barrier}}
      - precedes: {matches: fwd-3, stopBy: {matches: barrier}}
  bwd-1: {matches: comment}
  bwd-2:
    matches: comment
    any:
      - matches: lines-2
      - follows: {matches: bwd-1, stopBy: {matches: barrier}}
  bwd-3:
    matches: comment
    any:
      - matches: lines-3
      - all:
          - matches: lines-2
          - follows: {matches: bwd-1, stopBy: {matches: barrier}}
      - follows: {matches: bwd-2, stopBy: {matches: barrier}}
rule:
  any:
    - matches: fwd-4
    - all:
        - matches: fwd-3
        - follows: {matches: bwd-1, stopBy: {matches: barrier}}
    - all:
        - matches: fwd-2
        - follows: {matches: bwd-2, stopBy: {matches: barrier}}
    - all:
        - matches: fwd-1
        - follows: {matches: bwd-3, stopBy: {matches: barrier}}
